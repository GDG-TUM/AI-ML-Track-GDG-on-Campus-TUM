# Keeps GitHub Actions and Python dependencies fresh with small, reviewable PRs.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies, github_actions]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies, python]
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: "/projects/_template"
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies, python]
    groups:
      template-deps:
        patterns: ["*"]
